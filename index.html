<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>GÖZCÜ V55 | GİRİŞ</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Giriş Paneli Tasarımı */
        #giris-ekrani { text-align: center; padding: 30px; border: 2px solid #333; border-radius: 20px; background: #111; box-shadow: 0 0 20px rgba(0,255,0,0.1); width: 85%; max-width: 350px; }
        .input-group { margin-bottom: 15px; }
        input { background: #000; border: 1px solid #333; color: #00ff00; padding: 12px; width: 85%; border-radius: 8px; text-align: center; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--ana-renk); box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        .giris-btn { background: var(--ana-renk); color: #000; border: none; padding: 15px 0; width: 93%; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .giris-btn:active { transform: scale(0.95); opacity: 0.8; }
        
        /* Ana Panel (Başta Gizli) */
        #ana-panel { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; padding-top: 20px; }
        .monitor-kasa { width: 95%; max-width: 500px; border: 2px solid #333; border-radius: 20px; overflow: hidden; position: relative; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .yayin { width: 100%; display: block; }
        .kontrol-merkezi { width: 95%; max-width: 500px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .islem-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 14px; }
        .canli-yazisi { position: absolute; top: 10px; left: 10px; background: red; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <h2 style="margin-bottom: 25px; letter-spacing: 1px;">GÖZCÜ V55</h2>
        
        <div class="input-group">
            <input type="text" id="userInput" placeholder="Kullanıcı Adı">
        </div>
        
        <div class="input-group">
            <input type="password" id="passInput" placeholder="Şifre">
        </div>

        <button class="giris-btn" onclick="login()">GİRİŞ YAP</button>
        
        <p id="hataMesaji" style="color: #ff4444; font-size: 12px; margin-top: 15px; display: none;">Bilgiler Hatalı Gadaşım!</p>
    </div>

    <div id="ana-panel">
        <div style="margin-bottom: 15px; font-weight: bold; letter-spacing: 2px; color: var(--ana-renk);">KAHRAMAN SAVUNMA SİSTEMİ</div>
        
        <div class="monitor-kasa">
            <div class="canli-yazisi">CANLI</div>
            <img src="http://PAZARTESI_IP_ADRESIN:81/stream" class="yayin" id="canliAkis">
        </div>

        <div class="kontrol-merkezi">
            <button class="islem-btn" style="grid-column: span 2; border-color: var(--ana-renk); color: var(--ana-renk);" onclick="location.reload()">SİNYALİ TAZELE</button>
            <button class="islem-btn" onclick="alert('Fotoğraf Alındı!')">📸 FOTO ÇEK</button>
            <button class="islem-btn" onclick="alert('Sensörler Aktif!')">🛡️ GÜVENLİK</button>
        </div>
        
        <div style="margin-top: auto; padding-bottom: 25px; font-size: 10px; color: #444; letter-spacing: 1px;">BAFRA - İZMİT HATTI | GADAŞIM ÖZEL SÜRÜM</div>
    </div>

    <script>
        function login() {
            var user = document.getElementById("userInput").value;
            var pass = document.getElementById("passInput").value;
            
            // AYARLAR: Buradan kullanıcı adı ve şifreyi değiştirebilirsin
            var dogruUser = "admin";
            var dogruPass = "5528";

            if (user === dogruUser && pass === dogruPass) {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-panel").style.display = "flex";
            } else {
                document.getElementById("hataMesaji").style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }
    </script>
</body>
</html>
