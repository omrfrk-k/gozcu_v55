<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KAHRAMAN TARIM</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; --panel-renk: #1a1a1a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* ÜST BAR */
        .top-bar { background: var(--panel-renk); padding: 12px; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .menu-btn { font-size: 22px; cursor: pointer; padding: 0 10px; }
        .sayfa-baslik { flex-grow: 1; text-align: center; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        
        /* YAN MENÜ */
        .sidebar { position: fixed; left: -280px; top: 0; width: 250px; height: 100%; background: #111; border-right: 1px solid #333; transition: 0.3s; z-index: 200; padding: 20px; }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 10px; }

        /* ANALOG SAAT */
        .welcome-container { text-align: center; margin-top: 5vh; padding: 20px; }
        .welcome-title { color: #fff; font-size: 22px; font-weight: 900; margin-bottom: 25px; text-shadow: 0 0 10px rgba(0,255,0,0.2); }
        
        .clock-container { position: relative; width: 180px; height: 180px; border: 4px solid var(--ana-renk); border-radius: 50%; margin: 0 auto; background: #111; box-shadow: 0 0 20px rgba(0,255,0,0.1); }
        .clock-center { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: var(--ana-renk); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 5px; }
        .hour-hand { width: 6px; height: 45px; background: #fff; transform: translateX(-50%); }
        .min-hand { width: 4px; height: 65px; background: var(--ana-renk); transform: translateX(-50%); }
        .sec-hand { width: 2px; height: 75px; background: #ff4444; transform: translateX(-50%); }

        /* TAKVİM TASARIMI */
        .calendar-box { margin: 25px auto; background: #111; border: 1px solid #333; border-radius: 15px; width: 260px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .calendar-header { color: #fff; font-weight: bold; margin-bottom: 10px; font-size: 16px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; font-size: 12px; }
        .day-name { color: var(--ana-renk); font-weight: bold; margin-bottom: 5px; }
        .day-num { padding: 5px; color: #888; border-radius: 5px; }
        .day-num.today { background: var(--ana-renk); color: #000; font-weight: bold; }

        /* DİĞER BÖLÜMLER */
        .content-section { display: none; padding: 10px; flex-direction: column; align-items: center; }
        .content-section.active { display: flex; }

        /* GİRİŞ */
        #giris-ekrani { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { padding: 30px; border: 1px solid #333; border-radius: 20px; background: #111; width: 280px; text-align: center; }
        input { background: #000; border: 1px solid #333; color: var(--ana-renk); padding: 12px; width: 85%; border-radius: 10px; margin-bottom: 12px; text-align: center; outline: none; }
        .btn-aksiyon { background: var(--ana-renk); color: #000; border: none; padding: 14px; width: 95%; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <div class="login-box">
            <h3 style="color: var(--ana-renk); margin-bottom: 20px;">GÖZCÜ V95</h3>
            <input type="text" id="userInput" placeholder="Kullanıcı Adı">
            <input type="password" id="passInput" placeholder="Şifre">
            <button class="btn-aksiyon" onclick="login()">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="ana-sayfa" style="display:none;">
        <div class="top-bar">
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
            <div class="sayfa-baslik" id="current-title">SİSTEM PANELİ</div>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-item" onclick="showSection('welcome', 'ANA SAYFA')">🏠 ANA SAYFA</div>
            <div class="sidebar-item" onclick="showSection('kameralar', 'KAMERA SİSTEMİ')">📹 KAMERALAR</div>
            <div class="sidebar-item" onclick="showSection('kumes', 'ÇİFTLİK DURUMU')">🐣 ÇİFTLİK</div>
            <div class="sidebar-item" onclick="location.reload()" style="color: #ff4444; margin-top: 30px;">🚪 ÇIKIŞ YAP</div>
        </div>

        <div id="welcome" class="content-section active">
            <div class="welcome-container">
                <div class="welcome-title">KAHRAMAN TARIM VE HAYVANCILIK</div>
                
                <div class="clock-container">
                    <div class="clock-center"></div>
                    <div class="hand hour-hand" id="hourHand"></div>
                    <div class="hand min-hand" id="minHand"></div>
                    <div class="hand sec-hand" id="secHand"></div>
                </div>

                <div class="calendar-box">
                    <div class="calendar-header" id="calMonth">ŞUBAT 2026</div>
                    <div class="days-grid" id="daysGrid">
                        <div class="day-name">Pz</div><div class="day-name">Sa</div><div class="day-name">Ça</div><div class="day-name">Pe</div><div class="day-name">Cu</div><div class="day-name">Ct</div><div class="day-name">Pa</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="kameralar" class="content-section">
            <p style="color:#888;">Kameralar yükleniyor gadaşım...</p>
        </div>
    </div>

    <script>
        function login() {
            if (document.getElementById("userInput").value === "admin" && document.getElementById("passInput").value === "5528") {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-sayfa").style.display = "block";
                createCalendar();
                setInterval(updateClock, 1000);
            }
        }

        function toggleMenu() { document.getElementById("sidebar").classList.toggle("active"); }

        function showSection(id, title) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('current-title').innerText = title;
            toggleMenu();
        }

        function updateClock() {
            const now = new Date();
            const sec = now.getSeconds();
            const min = now.getMinutes();
            const hour = now.getHours();

            const secDeg = (sec / 60) * 360;
            const minDeg = ((min + sec/60) / 60) * 360;
            const hourDeg = ((hour % 12 + min/60) / 12) * 360;

            document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
        }

        function createCalendar() {
            const now = new Date();
            const aylar = ["OCAK", "ŞUBAT", "MART", "NİSAN", "MAYIS", "HAZİRAN", "TEMMUZ", "AĞUSTOS", "EYLÜL", "EKİM", "KASIM", "ARALIK"];
            document.getElementById("calMonth").innerText = aylar[now.getMonth()] + " " + now.getFullYear();

            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
            const lastDate = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const grid = document.getElementById("daysGrid");

            // JS getDay() Pazar=0 başladığı için düzeltme (Pazartesi=0 yapmak için)
            let startingPoint = firstDay === 0 ? 6 : firstDay - 1;

            for (let i = 0; i < startingPoint; i++) {
                grid.innerHTML += `<div class="day-num"></div>`;
            }

            for (let i = 1; i <= lastDate; i++) {
                const isToday = i === now.getDate() ? "today" : "";
                grid.innerHTML += `<div class="day-num ${isToday}">${i}</div>`;
            }
        }
    </script>
</body>
</html>
