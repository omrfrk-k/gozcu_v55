<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>GÖZCÜ V55 | GİRİŞ</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Giriş Paneli Tasarımı */
        #giris-ekrani { text-align: center; padding: 30px; border: 2px solid #333; border-radius: 20px; background: #111; box-shadow: 0 0 20px rgba(0,255,0,0.1); width: 80%; max-width: 350px; }
        input { background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 15px; width: 80%; border-radius: 10px; text-align: center; font-size: 20px; margin-bottom: 20px; outline: none; }
        .giris-btn { background: #00ff00; color: #000; border: none; padding: 15px 40px; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* Ana Panel (Başta Gizli) */
        #ana-panel { display: none; width: 100%; height: 100vh; flex-direction: column; align-items: center; padding-top: 20px; }
        .monitor-kasa { width: 95%; max-width: 500px; border: 2px solid #333; border-radius: 20px; overflow: hidden; position: relative; background: #000; }
        .yayin { width: 100%; display: block; }
        .kontrol-merkezi { width: 95%; max-width: 500px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .islem-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; border-radius: 15px; font-weight: bold; }
        .canli-yazisi { position: absolute; top: 10px; left: 10px; background: red; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; animation: blink 1.5s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <h2 style="margin-bottom: 30px;">GÖZCÜ V55<br><small style="color: #666; font-size: 12px;">SİSTEME GİRİŞ YAPIN</small></h2>
        <input type="password" id="sifreInput" placeholder="Şifre Giriniz">
        <br>
        <button class="giris-btn" onclick="sistemeGir()">SİSTEMİ AÇ</button>
        <p id="hataMesaji" style="color: red; font-size: 12px; margin-top: 15px; display: none;">Hatalı Şifre Gadaşım!</p>
    </div>

    <div id="ana-panel">
        <div style="margin-bottom: 15px; font-weight: bold; letter-spacing: 2px;">KAHRAMAN SAVUNMA</div>
        
        <div class="monitor-kasa">
            <div class="canli-yazisi">CANLI</div>
            <img src="http://PAZARTESI_IP_ADRESIN:81/stream" class="yayin" id="canliAkis">
        </div>

        <div class="kontrol-merkezi">
            <button class="islem-btn" style="grid-column: span 2; border-color: #0f0;" onclick="location.reload()">YAYINI TAZELE</button>
            <button class="islem-btn" onclick="alert('Fotoğraf Telegram\'a Gönderildi!')">📸 FOTO ÇEK</button>
            <button class="islem-btn" onclick="alert('Güvenlik Modu Aktif!')">🛡️ GÜVENLİK</button>
        </div>
        <div style="margin-top: auto; padding-bottom: 20px; font-size: 10px; color: #444;">BAFRA - İZMİT HATTI | 2026</div>
    </div>

    <script>
        function sistemeGir() {
            var girilenSifre = document.getElementById("sifreInput").value;
            var dogruSifre = "5528"; // GADAŞIM ŞİFREN BURADA, İSTEDİĞİNİ YAP!

            if (girilenSifre === dogruSifre) {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-panel").style.display = "flex";
            } else {
                document.getElementById("hataMesaji").style.display = "block";
                document.getElementById("sifreInput").value = "";
            }
        }
    </script>
</body>
</html>
