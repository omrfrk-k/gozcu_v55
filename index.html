<!DOCTYPE html>
<html lang="tr">
<head>

        .btn:active { background: #00ff00; color: #000; }
        .alt-not { font-size: 11px; color: #444; margin-top: 30px; letter-spacing: 1px; }
        .durum-isigi { display: inline-block; width: 10px; height: 10px; background: #00ff00; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 5px #00ff00; }
    </style>
</head>
