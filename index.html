<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KAHRAMAN TARIM</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; --panel-renk: #1a1a1a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        /* ÜST BAR */
        .top-bar { background: var(--panel-renk); padding: 12px; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .menu-btn { font-size: 22px; cursor: pointer; padding: 0 10px; }
        .sayfa-baslik { flex-grow: 1; text-align: center; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        
        /* YAN MENÜ */
        .sidebar { position: fixed; left: -280px; top: 0; width: 250px; height: 100%; background: #111; border-right: 1px solid #333; transition: 0.3s; z-index: 200; padding: 20px; }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 10px; }

        /* HOŞGELDİN EKRANI VE ANLIK SAAT */
        .welcome-container { text-align: center; margin-top: 25vh; padding: 20px; }
        .welcome-title { color: #fff; font-size: 26px; font-weight: 900; text-shadow: 0 0 15px rgba(0,255,0,0.3); margin-bottom: 5px; }
        .welcome-sub { color: var(--ana-renk); font-size: 12px; letter-spacing: 4px; margin-bottom: 40px; }
        
        .ana-saat-kutu { background: #111; border: 1px solid #333; padding: 20px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .ana-saat { font-size: 48px; font-weight: bold; color: #fff; font-family: 'Courier New', monospace; }
        .ana-tarih { font-size: 16px; color: var(--ana-renk); margin-top: 5px; letter-spacing: 2px; }

        /* KAMERALAR VE HAVA DURUMU */
        .content-section { display: none; padding: 10px; flex-direction: column; align-items: center; }
        .content-section.active { display: flex; }
        .hava-durumu-bar { background: #111; width: 92%; margin-bottom: 15px; padding: 10px; border-radius: 12px; border: 1px solid #333; display: flex; justify-content: space-around; align-items: center; font-size: 11px; }
        .vurgu { color: #fff; font-weight: bold; font-size: 15px; display: block; }

        .kamera-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 98%; max-width: 600px; }
        .monitor-kasa { border: 1px solid #333; border-radius: 10px; overflow: hidden; position: relative; background: #000; }
        .yayin { width: 100%; display: block; aspect-ratio: 1/1; object-fit: cover; }
        .zaman-damgasi { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,0.6); color: #fff; padding: 2px 5px; border-radius: 3px; font-size: 8px; }
        
        /* GİRİŞ */
        #giris-ekrani { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { padding: 25px; border: 1px solid #333; border-radius: 15px; background: #111; width: 280px; text-align: center; }
        input { background: #000; border: 1px solid #333; color: var(--ana-renk); padding: 10px; width: 85%; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        .btn-aksiyon { background: var(--ana-renk); color: #000; border: none; padding: 12px; width: 93%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <div class="login-box">
            <h3 style="color: var(--ana-renk);">GÖZCÜ V80</h3>
            <input type="text" id="userInput" placeholder="Kullanıcı">
            <input type="password" id="passInput" placeholder="Şifre">
            <button class="btn-aksiyon" onclick="login()">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="ana-sayfa" style="display:none;">
        <div class="top-bar">
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
            <div class="sayfa-baslik" id="current-title">ANA SAYFA</div>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-item" onclick="showSection('welcome', 'ANA SAYFA')">🏠 ANA SAYFA</div>
            <div class="sidebar-item" onclick="showSection('kameralar', 'KAMERALAR')">📹 KAMERALAR</div>
            <div class="sidebar-item" onclick="showSection('kumes', 'ÇİFTLİK DURUMU')">🐣 ÇİFTLİK</div>
            <div class="sidebar-item" onclick="location.reload()" style="color:red;">🚪 ÇIKIŞ</div>
        </div>

        <div id="welcome" class="content-section active">
            <div class="welcome-container">
                <div class="welcome-title">KAHRAMAN TARIM VE HAYVANCILIK</div>
                <div class="welcome-sub">AKILLI ÇİFTLİK YÖNETİMİ</div>
                
                <div class="ana-saat-kutu">
                    <div class="ana-saat" id="büyükSaat">00:00:00</div>
                    <div class="ana-tarih" id="büyükTarih">-- --- ---- -------</div>
                </div>
            </div>
        </div>

        <div id="kameralar" class="content-section">
            <div class="hava-durumu-bar">
                <div style="text-align:center;">ÇİFTLİK <span class="vurgu">24.5°C</span></div>
                <div style="text-align:center;">BAFRA <span class="vurgu" id="mgmSicaklik">--°C</span></div>
                <div style="text-align:center;">DURUM <span class="vurgu" id="mgmDurum" style="font-size:10px;">YÜKLENİYOR</span></div>
            </div>
            <div class="kamera-grid">
                <div class="monitor-kasa"><img src="http://IP_ADRESI:81/stream" class="yayin"><div class="zaman-damgasi"><span class="tarihSaat">--:--</span></div></div>
                <div class="monitor-kasa"><img src="http://IP_ADRESI:81/stream" class="yayin"><div class="zaman-damgasi"><span class="tarihSaat">--:--</span></div></div>
            </div>
        </div>
        
    </div>

    <script>
        function login() {
            if (document.getElementById("userInput").value === "admin" && document.getElementById("passInput").value === "5528") {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-sayfa").style.display = "block";
                getHavaDurumu();
                setInterval(updateTime, 1000);
            }
        }
        function toggleMenu() { document.getElementById("sidebar").classList.toggle("active"); }
        function showSection(id, title) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('current-title').innerText = title;
            toggleMenu();
        }
        function updateTime() {
            const simdi = new Date();
            const saat = simdi.toLocaleTimeString('tr-TR');
            const gunler = ["PAZAR", "PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA", "CUMARTESİ"];
            const tarih = simdi.getDate() + " " + simdi.toLocaleString('tr-TR', { month: 'LONG' }).toUpperCase() + " " + simdi.getFullYear() + " " + gunler[simdi.getDay()];
            
            if(document.getElementById("büyükSaat")) document.getElementById("büyükSaat").innerText = saat;
            if(document.getElementById("büyükTarih")) document.getElementById("büyükTarih").innerText = tarih;
            document.querySelectorAll('.tarihSaat').forEach(d => d.innerText = saat);
        }
        async function getHavaDurumu() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.5677&longitude=35.9069&current_weather=true');
                const data = await response.json();
                document.getElementById("mgmSicaklik").innerText = data.current_weather.temperature + "°C";
                document.getElementById("mgmDurum").innerText = "AÇIK";
            } catch (e) { document.getElementById("mgmDurum").innerText = "HATA"; }
        }
    </script>
</body>
</html>
