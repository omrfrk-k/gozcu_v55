<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ÇİFTLİK YÖNETİM SİSTEMİ</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; --panel-renk: #1a1a1a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* GİRİŞ EKRANI */
        #giris-ekrani { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .login-box { padding: 30px; border: 1px solid #333; border-radius: 20px; background: #111; width: 80%; max-width: 320px; }
        input { background: #000; border: 1px solid #333; color: var(--ana-renk); padding: 12px; width: 85%; border-radius: 10px; margin-bottom: 10px; text-align: center; }
        .btn-giris { background: var(--ana-renk); color: #000; border: none; padding: 15px; width: 95%; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* ANA SAYFA YAPISI */
        #ana-sayfa { display: none; min-height: 100vh; }
        
        /* ÜST BAR */
        .top-bar { background: var(--panel-renk); padding: 15px; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .menu-btn { font-size: 24px; cursor: pointer; padding: 5px 15px; }
        .sayfa-baslik { flex-grow: 1; text-align: center; font-weight: bold; letter-spacing: 1px; }

        /* YAN MENÜ (SIDEBAR) */
        .sidebar { position: fixed; left: -280px; top: 0; width: 250px; height: 100%; background: #111; border-right: 1px solid #333; transition: 0.3s; z-index: 200; padding: 20px; }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 15px; border: 1px solid #222; margin-bottom: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .sidebar-item:active { background: var(--ana-renk); color: #000; }

        /* İÇERİK ALANLARI */
        .content-section { display: none; padding: 15px; flex-direction: column; align-items: center; }
        .content-section.active { display: flex; }

        /* KAMERA SİSTEMİ (ÖNCEKİ TASARIM) */
        .kamera-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
        .monitor-kasa { flex: 1; min-width: 300px; border: 2px solid #333; border-radius: 15px; overflow: hidden; position: relative; }
        .yayin { width: 100%; display: block; aspect-ratio: 4/3; background: #000; }
        .zaman-damgasi { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px; border-radius: 5px; font-size: 10px; }

        /* KÜMES DURUMU */
        .veriler-listesi { width: 100%; max-width: 500px; }
        .veri-kart { background: #1a1a1a; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #333; display: flex; justify-content: space-between; }
        .veri-deger { font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">ÇİFTLİK V60</h2>
            <input type="text" id="userInput" placeholder="Kullanıcı Adı">
            <input type="password" id="passInput" placeholder="Şifre">
            <button class="btn-giris" onclick="login()">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="ana-sayfa">
        <div class="top-bar">
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
            <div class="sayfa-baslik" id="current-title">ANA SAYFA</div>
        </div>

        <div class="sidebar" id="sidebar">
            <div style="font-size: 20px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 10px;">MENÜ</div>
            <div class="sidebar-item" onclick="showSection('kameralar', 'KAMERA SİSTEMİ')">📹 KAMERA SİSTEMİ</div>
            <div class="sidebar-item" onclick="showSection('kumes', 'KÜMES DURUMU')">🐣 KÜMES DURUMU</div>
            <div class="sidebar-item" onclick="location.reload()" style="margin-top: 50px; color: red;">🚪 ÇIKIŞ YAP</div>
        </div>

        <div id="kameralar" class="content-section">
            <div class="kamera-grid">
                <div class="monitor-kasa">
                    <img src="http://PAZARTESI_IP:81/stream" class="yayin">
                    <div class="zaman-damgasi">KAM 01 - <span class="tarihSaat">--:--</span></div>
                </div>
                <div class="monitor-kasa">
                    <img src="http://PAZARTESI_IP:81/stream" class="yayin">
                    <div class="zaman-damgasi">KAM 02 - <span class="tarihSaat">--:--</span></div>
                </div>
            </div>
            <button class="btn-giris" style="margin-top: 20px;" onclick="location.reload()">SİNYALİ TAZELE</button>
        </div>

        <div id="kumes" class="content-section">
            <div class="veriler-listesi">
                <div class="veri-kart"><span>🌡️ İÇ SICAKLIK</span> <span class="veri-deger">24.5°C</span></div>
                <div class="veri-kart"><span>💧 NEM ORANI</span> <span class="veri-deger">%62</span></div>
                <div class="veri-kart"><span>🥣 YEM SEVİYESİ</span> <span class="veri-deger">%85</span></div>
                <div class="veri-kart"><span>🚿 SU DURUMU</span> <span class="veri-deger">AKTİF</span></div>
            </div>
        </div>
    </div>

    <script>
        function login() {
            if (document.getElementById("userInput").value === "admin" && document.getElementById("passInput").value === "5528") {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-sayfa").style.display = "block";
                showSection('kameralar', 'KAMERA SİSTEMİ');
                setInterval(updateTime, 1000);
            }
        }

        function toggleMenu() {
            document.getElementById("sidebar").classList.toggle("active");
        }

        function showSection(sectionId, title) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.getElementById('current-title').innerText = title;
            toggleMenu(); // Menüyü kapat
        }

        function updateTime() {
            const simdi = new Date();
            const formatli = simdi.toLocaleTimeString('tr-TR');
            document.querySelectorAll('.tarihSaat').forEach(d => d.innerText = formatli);
        }
    </script>
</body>
</html>
