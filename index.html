<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KAHRAMAN TARIM</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; --panel-renk: #1a1a1a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }

        .top-bar { background: var(--panel-renk); padding: 12px; display: flex; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .menu-btn { font-size: 22px; cursor: pointer; padding: 0 10px; }
        .sayfa-baslik { flex-grow: 1; text-align: center; font-weight: bold; font-size: 14px; }
        
        .sidebar { position: fixed; left: -280px; top: 0; width: 250px; height: 100%; background: #111; border-right: 1px solid #333; transition: 0.3s; z-index: 200; padding: 20px; }
        .sidebar.active { left: 0; }
        .sidebar-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; font-weight: bold; }

        /* ANALOG SAAT TASARIMI */
        .welcome-container { text-align: center; margin-top: 15vh; padding: 20px; }
        .welcome-title { color: #fff; font-size: 24px; font-weight: 900; margin-bottom: 30px; }
        
        .clock-container { position: relative; width: 200px; height: 200px; border: 4px solid var(--ana-renk); border-radius: 50%; margin: 0 auto; background: #111; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        .clock-center { position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; background: var(--ana-renk); border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; border-radius: 5px; }
        .hour-hand { width: 6px; height: 50px; background: #fff; transform: translateX(-50%); }
        .min-hand { width: 4px; height: 75px; background: var(--ana-renk); transform: translateX(-50%); }
        .sec-hand { width: 2px; height: 85px; background: #ff0000; transform: translateX(-50%); }
        
        /* Saat Rakamları Yerine Noktalar */
        .dot { position: absolute; width: 4px; height: 4px; background: #444; border-radius: 50%; top: 50%; left: 50%; }

        .ana-tarih { font-size: 16px; color: var(--ana-renk); margin-top: 30px; letter-spacing: 2px; font-weight: bold; }

        /* DİĞER BÖLÜMLER */
        .content-section { display: none; padding: 10px; flex-direction: column; align-items: center; }
        .content-section.active { display: flex; }
        .hava-durumu-bar { background: #111; width: 92%; margin-bottom: 15px; padding: 10px; border-radius: 12px; border: 1px solid #333; display: flex; justify-content: space-around; align-items: center; font-size: 11px; }
        .vurgu { color: #fff; font-weight: bold; font-size: 15px; }

        /* GİRİŞ */
        #giris-ekrani { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { padding: 25px; border: 1px solid #333; border-radius: 15px; background: #111; width: 280px; text-align: center; }
        input { background: #000; border: 1px solid #333; color: var(--ana-renk); padding: 10px; width: 85%; border-radius: 8px; margin-bottom: 10px; text-align: center; }
        .btn-aksiyon { background: var(--ana-renk); color: #000; border: none; padding: 12px; width: 93%; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <div class="login-box">
            <h3 style="color: var(--ana-renk);">GÖZCÜ V85</h3>
            <input type="text" id="userInput" placeholder="Kullanıcı">
            <input type="password" id="passInput" placeholder="Şifre">
            <button class="btn-aksiyon" onclick="login()">GİRİŞ YAP</button>
        </div>
    </div>

    <div id="ana-sayfa" style="display:none;">
        <div class="top-bar">
            <div class="menu-btn" onclick="toggleMenu()">☰</div>
            <div class="sayfa-baslik" id="current-title">ANA SAYFA</div>
        </div>

        <div class="sidebar" id="sidebar">
            <div class="sidebar-item" onclick="showSection('welcome', 'ANA SAYFA')">🏠 ANA SAYFA</div>
            <div class="sidebar-item" onclick="showSection('kameralar', 'KAMERALAR')">📹 KAMERALAR</div>
            <div class="sidebar-item" onclick="location.reload()" style="color:red;">🚪 ÇIKIŞ</div>
        </div>

        <div id="welcome" class="content-section active">
            <div class="welcome-container">
                <div class="welcome-title">KAHRAMAN TARIM VE HAYVANCILIK</div>
                
                <div class="clock-container">
                    <div class="clock-center"></div>
                    <div class="hand hour-hand" id="hourHand"></div>
                    <div class="hand min-hand" id="minHand"></div>
                    <div class="hand sec-hand" id="secHand"></div>
                </div>

                <div class="ana-tarih" id="büyükTarih">-- --- ---- -------</div>
            </div>
        </div>

        <div id="kameralar" class="content-section">
            <div class="hava-durumu-bar">
                <div style="text-align:center;">ÇİFTLİK <span class="vurgu">24.5°C</span></div>
                <div style="text-align:center;">BAFRA <span class="vurgu" id="mgmSicaklik">--°C</span></div>
            </div>
            <div style="color: #fff; font-size: 12px;">Sinyal Bekleniyor...</div>
        </div>
    </div>

    <script>
        function login() {
            if (document.getElementById("userInput").value === "admin" && document.getElementById("passInput").value === "5528") {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-sayfa").style.display = "block";
                getHavaDurumu();
                setInterval(updateClock, 1000);
            }
        }
        function toggleMenu() { document.getElementById("sidebar").classList.toggle("active"); }
        function showSection(id, title) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('current-title').innerText = title;
            toggleMenu();
        }
        function updateClock() {
            const now = new Date();
            const sec = now.getSeconds();
            const min = now.getMinutes();
            const hour = now.getHours();

            const secDeg = (sec / 60) * 360;
            const minDeg = ((min + sec/60) / 60) * 360;
            const hourDeg = ((hour % 12 + min/60) / 12) * 360;

            document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            const gunler = ["PAZAR", "PAZARTESİ", "SALI", "ÇARŞAMBA", "PERŞEMBE", "CUMA", "CUMARTESİ"];
            const tarih = now.getDate() + " " + now.toLocaleString('tr-TR', { month: 'LONG' }).toUpperCase() + " " + now.getFullYear() + " " + gunler[now.getDay()];
            document.getElementById("büyükTarih").innerText = tarih;
        }
        async function getHavaDurumu() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.5677&longitude=35.9069&current_weather=true');
                const data = await response.json();
                document.getElementById("mgmSicaklik").innerText = data.current_weather.temperature + "°C";
            } catch (e) { }
        }
    </script>
</body>
</html>
