<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ÇİFTLİK GÜVENLİK SİSTEMİ</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        
        /* Giriş Paneli */
        #giris-ekrani { text-align: center; padding: 30px; border: 2px solid #333; border-radius: 20px; background: #111; width: 85%; max-width: 350px; margin-top: 20vh; }
        .input-group { margin-bottom: 15px; }
        input { background: #000; border: 1px solid #333; color: #00ff00; padding: 12px; width: 85%; border-radius: 8px; text-align: center; font-size: 16px; outline: none; }
        .giris-btn { background: var(--ana-renk); color: #000; border: none; padding: 15px 0; width: 93%; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* Ana Panel */
        #ana-panel { display: none; width: 100%; flex-direction: column; align-items: center; }
        .ust-bilgi { width: 95%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        /* Derece Göstergesi (Sol Üst) */
        .derece-kutu { background: rgba(0,0,0,0.8); border: 1px solid var(--ana-renk); border-radius: 10px; padding: 10px; text-align: left; box-shadow: 0 0 10px rgba(0,255,0,0.2); }
        .derece-deger { font-size: 24px; font-weight: bold; }
        .derece-etiket { font-size: 10px; color: #888; }

        /* Hava Tahmin Kutusu */
        .hava-tahmin { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 10px; width: 95%; max-width: 900px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-around; }
        .tahmin-item { text-align: center; }
        .tahmin-deger { font-size: 14px; color: #fff; }

        /* Kamera Izgarası */
        .kamera-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: 900px; }
        .monitor-kasa { flex: 1; min-width: 300px; border: 2px solid #333; border-radius: 15px; overflow: hidden; position: relative; background: #000; }
        .yayin { width: 100%; display: block; aspect-ratio: 4/3; }
        
        /* Kontrol Paneli */
        .kontrol-merkezi { width: 95%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .islem-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; }
        
        .canli-yazisi { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <h2 style="margin-bottom: 25px;">ÇİFTLİK SİSTEMİ</h2>
        <div class="input-group"><input type="text" id="userInput" placeholder="Kullanıcı Adı"></div>
        <div class="input-group"><input type="password" id="passInput" placeholder="Şifre"></div>
        <button class="giris-btn" onclick="login()">GİRİŞ YAP</button>
    </div>

    <div id="ana-panel">
        <div class="ust-bilgi">
            <div class="derece-kutu">
                <div class="derece-deger" id="sensorDerece">24.5°C</div>
                <div class="derece-etiket">KÜMES SICAKLIK</div>
            </div>
            <div style="text-align: right; font-weight: bold;">ÇİFTLİK GÜVENLİK</div>
        </div>

        <div class="hava-tahmin">
            <div class="tahmin-item">
                <div class="derece-etiket">BAFRA HAVA DURUMU</div>
                <div class="tahmin-deger" id="mgmDurum">Yükleniyor...</div>
            </div>
            <div class="tahmin-item">
                <div class="derece-etiket">BEKLENEN</div>
                <div class="tahmin-deger" id="mgmSicaklik">--°C</div>
            </div>
        </div>
        
        <div class="kamera-grid">
            <div class="monitor-kasa">
                <div class="canli-yazisi">CANLI</div>
                <img src="http://PAZARTESI_IP_ADRESIN:81/stream" class="yayin" id="kamera1">
            </div>
            <div class="monitor-kasa">
                <div class="canli-yazisi">CANLI</div>
                <img src="http://PAZARTESI_IP_ADRESIN:81/stream" class="yayin" id="kamera2">
            </div>
        </div>

        <div class="kontrol-merkezi">
            <button class="islem-btn" onclick="alert('1. Kamera Fotoğrafı Çekildi!')">📸 FOTOĞRAF ÇEK - 1</button>
            <button class="islem-btn" onclick="alert('2. Kamera Fotoğrafı Çekildi!')">📸 FOTOĞRAF ÇEK - 2</button>
            <button class="islem-btn" style="grid-column: span 2;" onclick="location.reload()">🔄 SİNYAL TAZELE</button>
        </div>
    </div>

    <script>
        function login() {
            var user = document.getElementById("userInput").value;
            var pass = document.getElementById("passInput").value;
            if (user === "admin" && pass === "5528") {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-panel").style.display = "flex";
                getHavaDurumu();
            }
        }

        // MGM veya Açık Kaynak API'den Bafra Hava Durumunu Çekme
        async function getHavaDurumu() {
            try {
                // Not: Tarayıcı güvenliği için direkt MGM çekmek zordur, açık API (Open-Meteo) kullanıyoruz
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=41.5677&longitude=35.9069&current_weather=true');
                const data = await response.json();
                document.getElementById("mgmSicaklik").innerText = data.current_weather.temperature + "°C";
                document.getElementById("mgmDurum").innerText = "AÇIK / GÜNEŞLİ";
            } catch (error) {
                document.getElementById("mgmDurum").innerText = "BAĞLANTI YOK";
            }
        }
    </script>
</body>
</html>
