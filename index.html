<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GÖZCÜ V55 | KAHRAMAN SAVUNMA</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0d0d0d; --panel-renk: #1a1a1a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        /* Başlık ve Durum */
        .header { margin-top: 10px; margin-bottom: 20px; }
        .baslik { font-size: 22px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,255,0,0.5); }
        .durum-etiket { font-size: 10px; background: #333; padding: 4px 10px; border-radius: 20px; color: #aaa; margin-top: 5px; display: inline-block; }
        
        /* Kamera Ekranı */
        .monitor-kasa { width: 100%; max-width: 500px; border: 2px solid #333; border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: #000; }
        .yayin { width: 100%; display: block; min-height: 280px; }
        .canli-yazisi { position: absolute; top: 15px; left: 15px; background: rgba(255, 0, 0, 0.8); color: white; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: blink 1.5s infinite; }
        
        /* Kontrol Butonları */
        .kontrol-merkezi { width: 100%; max-width: 500px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }
        .islem-btn { background: var(--panel-renk); border: 1px solid #333; color: white; padding: 20px; border-radius: 15px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .islem-btn:active { transform: scale(0.95); border-color: var(--ana-renk); color: var(--ana-renk); }
        .islem-btn i { font-size: 20px; }
        
        .yenile-btn { grid-column: span 2; border: 1px solid var(--ana-renk); color: var(--ana-renk); }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
        .footer { margin-top: 40px; font-size: 11px; color: #444; }
    </style>
</head>
<body>

    <div class="header">
        <div class="baslik">GÖZCÜ V55</div>
        <div class="durum-etiket">● BAFRA - İZMİT ÇEVRİMİÇİ</div>
    </div>

    <div class="monitor-kasa">
        <div class="canli-yazisi">CANLI</div>
        <img src="http://PAZARTESI_IP_ADRESIN:81/stream" class="yayin" id="canliAkis" alt="Sinyal Bekleniyor...">
    </div>

    <div class="kontrol-merkezi">
        <button class="islem-btn yenile-btn" onclick="tazele()">YAYINI TAZELE</button>
        <button class="islem-btn" onclick="alert('Görüntü Buluta Kaydedildi!')">📸 FOTO ÇEK</button>
        <button class="islem-btn" onclick="alert('Hareket Sensörü Aktif!')">🛡️ GÜVENLİK</button>
    </div>

    <div class="footer">
        KAHRAMAN SAVUNMA SİSTEMLERİ | 2026
    </div>

    <script>
        function tazele() {
            var img = document.getElementById('canliAkis');
            var suan = new Date().getTime();
            img.src = img.src.split('?')[0] + '?t=' + suan;
        }
    </script>
</body>
</html>
