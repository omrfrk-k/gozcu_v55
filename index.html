<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ÇİFTLİK GÜVENLİK SİSTEMİ</title>
    <style>
        :root { --ana-renk: #00ff00; --arka-plan: #0a0a0a; }
        body { background: var(--arka-plan); color: var(--ana-renk); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        /* Giriş Paneli */
        #giris-ekrani { text-align: center; padding: 30px; border: 2px solid #333; border-radius: 20px; background: #111; width: 85%; max-width: 350px; }
        .input-group { margin-bottom: 15px; }
        input { background: #000; border: 1px solid #333; color: #00ff00; padding: 12px; width: 85%; border-radius: 8px; text-align: center; font-size: 16px; outline: none; }
        .giris-btn { background: var(--ana-renk); color: #000; border: none; padding: 15px 0; width: 93%; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        /* Ana Panel */
        #ana-panel { display: none; width: 100%; flex-direction: column; align-items: center; padding: 20px 0; }
        .baslik-alan { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: var(--ana-renk); margin-bottom: 20px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0,255,0,0.3); }
        
        /* Kamera Izgarası (Yan Yana) */
        .kamera-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 95%; max-width: 900px; }
        .monitor-kasa { flex: 1; min-width: 300px; border: 2px solid #333; border-radius: 15px; overflow: hidden; position: relative; background: #000; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .yayin { width: 100%; display: block; height: auto; aspect-ratio: 4/3; }
        
        /* Kontrol Paneli */
        .kontrol-merkezi { width: 95%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .islem-btn { background: #1a1a1a; border: 1px solid #333; color: white; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .islem-btn:active { background: var(--ana-renk); color: #000; }
        
        .canli-yazisi { position: absolute; top: 10px; left: 10px; background: red; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; animation: blink 1.5s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }
        .cam-label { background: rgba(0,0,0,0.6); color: #fff; position: absolute; bottom: 0; width: 100%; padding: 5px; font-size: 12px; text-align: center; }
    </style>
</head>
<body>

    <div id="giris-ekrani">
        <h2 style="margin-bottom: 25px;">ÇİFTLİK SİSTEMİ</h2>
        <div class="input-group"><input type="text" id="userInput" placeholder="Kullanıcı Adı"></div>
        <div class="input-group"><input type="password" id="passInput" placeholder="Şifre"></div>
        <button class="giris-btn" onclick="login()">GİRİŞ YAP</button>
        <p id="hataMesaji" style="color: #ff4444; font-size: 12px; margin-top: 15px; display: none;">Hatalı Giriş Gadaşım!</p>
    </div>

    <div id="ana-panel">
        <div class="baslik-alan">ÇİFTLİK GÜVENLİK SİSTEMİ</div>
        
        <div class="kamera-grid">
            <div class="monitor-kasa">
                <div class="canli-yazisi">CANLI</div>
                <img src="http://PAZARTESI_IP_ADRESIN:81/stream" class="yayin" id="kamera1">
                <div class="cam-label">KAMERA 01 - ANA GİRİŞ</div>
            </div>
            <div class="monitor-kasa">
                <div class="canli-yazisi">CANLI</div>
                <img src="http://PAZARTESI_IP_ADRESIN:81/stream" class="yayin" id="kamera2">
                <div class="cam-label">KAMERA 02 - KÜMES İÇİ</div>
            </div>
        </div>

        <div class="kontrol-merkezi">
            <button class="islem-btn" onclick="alert('1. Kamera Fotoğrafı Çekildi!')">📸 FOTOĞRAF ÇEK - 1</button>
            <button class="islem-btn" onclick="alert('2. Kamera Fotoğrafı Çekildi!')">📸 FOTOĞRAF ÇEK - 2</button>
            <button class="islem-btn" onclick="alert('Sinyal Tazelendi!')">🔄 SİNYAL TAZELE</button>
            <button class="islem-btn" onclick="alert('Güvenlik Modu Aktif!')">🛡️ GÜVENLİK MODU</button>
        </div>
        
        <div style="margin-top: 30px; font-size: 10px; color: #444;">BAFRA ÇİFTLİK HATTI | RIFKI V55</div>
    </div>

    <script>
        function login() {
            var user = document.getElementById("userInput").value;
            var pass = document.getElementById("passInput").value;
            if (user === "admin" && pass === "5528") {
                document.getElementById("giris-ekrani").style.display = "none";
                document.getElementById("ana-panel").style.display = "flex";
            } else {
                document.getElementById("hataMesaji").style.display = "block";
            }
        }
    </script>
</body>
</html>
